packages:
  - "packages/*"

# handlebars <4.7.9 carries the 2026 JS-injection advisory batch (GHSA-2w6w-674q-4c4q
# et al.), pulled dev-only via eslint-plugin-boundaries@5 → @boundaries/elements.
# Drop when eslint-plugin-boundaries is bumped to ≥7 (pins 4.7.9 itself).
overrides:
  handlebars: ^4.7.9
  # Dev-only transitives flagged by osv-scanner (pnpm audit --prod does not see them):
  # brace-expansion GHSA-rgw5-rvv9-x895 (ReDoS), postcss GHSA-fxqj-rqcc-2cmp (arbitrary
  # .map read), undici GHSA-4cwx-7wf7-3272 (cache cross-user disclosure),
  # js-yaml GHSA-5p4m-2wfm-xmqj (HIGH, prototype pollution via the schema loader —
  # reaches us through eslint and jscpd config parsing), nanoid GHSA-2v37-7h3g-55p8
  # (HIGH, predictable ids from a non-uniform RNG — via vite/postcss asset naming).
  # Each pin is the first patched release in the range every dependent already accepts,
  # so nothing here forces a major bump on a dependent.
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  postcss: ^8.5.23
  undici: ^7.29.0
  # 4.3.2 also closes GHSA-2883-xcg3-v3hh (HIGH, maxTotalMergeKeys does not limit
  # CPU use for empty merge sources).
  js-yaml: ^4.3.2
  nanoid: ^3.3.17
