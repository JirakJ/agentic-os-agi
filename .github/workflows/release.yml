name: release

on:
  push:
    tags: ['*/v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate before publishing
        run: python3 plugins/core-orchestration/scripts/doctor.py

      - name: Identify the plugin from the tag
        id: plugin
        run: |
          echo "name=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*/v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the manifest
        run: |
          # A tag that disagrees with plugin.json means the release is a lie about what installs.
          manifest="plugins/${{ steps.plugin.outputs.name }}/.claude-plugin/plugin.json"
          declared=$(python3 -c "import json;print(json.load(open('$manifest'))['version'])")
          if [ "$declared" != "${{ steps.plugin.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.plugin.outputs.version }}, manifest says $declared"
            exit 1
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --include-path "plugins/${{ steps.plugin.outputs.name }}/**" --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.plugin.outputs.name }} v${{ steps.plugin.outputs.version }}"
          body: ${{ steps.cliff.outputs.content }}
