name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q scripts plugins
      - run: python scripts/build-adapters.py --check
      - run: python scripts/validate-copilot.py
      - run: python scripts/skill-budget-lint.py
      - run: bash scripts/hook-dryrun-harness.sh
      - run: pip install pytest && python -m pytest -q
  gate:
    uses: ./.github/workflows/jj-preflight.yml
