# gitleaks config for the ponytail security-gate.
# Scan SOURCE, not generated output. A real secret in source is flagged in
# source; build artifacts are derived. ponytail: paths-allowlist, not a
# rule-disable — if a build bundles a genuine private key from env (config bug),
# add a targeted rule rather than scanning all of dist/.
[extend]
useDefault = true

[allowlist]
description = "generated/build artifacts, vendored deps, and test fixtures"
paths = [
  '''(^|/)dist/''',
  '''(^|/)build/''',
  # graphify generated output (graph.json, GRAPH_REPORT.md, obsidian/) — derived from
  # source, concatenated node-label text trips entropy rules on generic-api-key etc.
  '''(^|/)graphify-out/''',
  '''(^|/)\.build/''',
  '''(^|/)\.next/''',
  '''(^|/)out/''',
  '''(^|/)node_modules/''',
  '''(^|/)DerivedData/''',
  '''(^|/)Pods/''',
  '''(^|/)\.git/''',
  '''(^|/)coverage/''',
  # Claude Code ephemeral worktrees: duplicates of the canonical tree, so a real
  # secret is still caught in its main-tree location, not in every worktree copy.
  '''(^|/)\.claude/worktrees/''',
  # Unreal Engine vendored third-party content (Epic ships a public Algolia
  # search-only key in the Megascans Bridge plugin — not our secret).
  '''(^|/)UE_5\.8/Engine/Plugins/''',
  # Test fixtures / credentials — fake by nature, not real secrets. A secret in a
  # test file is a fixture; real secrets live in env/config, which stay scanned.
  '''(^|/)src/test/''',
  '''(^|/)tests?/''',
  '''(^|/)__tests__/''',
  '''(^|/)__mocks__/''',
  '''(^|/)__fixtures__/''',
  '''(^|/)fixtures/''',
  '''(^|/)testdata/''',
  '''.*\.(test|spec|e2e)\.[cm]?[jt]sx?$''',
  '''.*Tests?\.(kt|java|swift)$''',
  '''.*Spec\.(kt|java|groovy)$''',
  # Unreal Engine vendor tree — engine constants + public Algolia search key (megascans), not our secrets
  '''(^|/)UE_5\.8/''',
  # Obsidian notes vault + UTAC client docs — API-spec examples in notes, not shipped code
  '''(^|/)obsidian/''',
  '''(^|/)UTAC/''',
  # Teaching/presentation material — deliberate dummy keys in slides/masterclasses
  '''(^|/)prezentace/''',
  # Security-research writeups (bounty submissions contain key material by nature)
  '''(^|/)bounty-hunter/''',
  # Compiled python bytecode — mirrors allowlisted sources
  '''(^|/)__pycache__/''',
  # Explicit example/template configs
  '''\.example\.(js|ts|json|env)$''',
  '''\.env\.example$''',
  # IntelliJ shelved patches — snapshots of working files that are scanned directly
  '''(^|/)\.idea/shelf/''',
  # jakub-jirak-blog: untracked local .env (webhook secret, never committed)
  '''jakub-jirak-blog/\.env$''',
  # local-secrets-tripwire plugin spec — example key material in design doc
  '''local-secrets-tripwire/plan/plan\.md$''',
  # .vercel/ is Vercel-CLI-generated and gitignored everywhere: build output + short-lived
  # auto-rotating OIDC tokens (.env.*.local), never committed. Real env secrets stay scanned.
  '''(^|/)\.vercel/''',
  # blog-2025: git-ignored local env files (never committed; see .gitignore)
  '''blog-2025/\.env(\.local)?$''',
  # blog-2025: docs with placeholder curl examples (vas-web.tld dummy domain)
  '''blog-2025/docs/courses-access\.md$''',
]

regexes = [
  # blog-2025 API routes + .idea shelf: literal placeholder fallbacks, not real keys
  '''sk_test_placeholder''',
  # k8s tutorial mdx: base64 of "supersecret"
  '''c3VwZXJzZWNyZXQ''',
  # UserDefaults key name (flux-station-zero), not a credential
  '''fluxEndlessSaveV1''',
  # logparser QUICKSTART license-format example
  '''TEST-1234-ABCD-5678''',
  # blog-2025 ai-incident-response-lab course mdx: curl -u "$ENV_VAR:" auth examples,
  # env var placeholders not literal credentials
  '''PAY_RO_KEY''',
  '''REFUND_TOOL_KEY''',
  # blog-2025 reliable-ai-agents course mdx: fake correlation ID in example JSON payload
  '''eff_9f2k1m8dq3ab''',
]
