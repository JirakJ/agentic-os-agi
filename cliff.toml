# git-cliff configuration for the agentic OS marketplace.
# Changelogs are DERIVED from Conventional Commits — never hand-edited. A sloppy commit message is
# a sloppy release note, permanently. That is the point: it makes commit hygiene load-bearing.

[changelog]
header = """
# Changelog

Derived from Conventional Commits by git-cliff. Do not edit by hand.\n
"""
body = """
{% if version %}\
## {{ version | split(pat="/") | last | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} — **BREAKING**{% endif %}\
{% for footer in commit.footers %}{% if footer.token == "Refs" %} ({{ footer.value }}){% endif %}{% endfor %}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = ".*/v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs\\(adr\\)", group = "Decisions" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^revert", group = "Reverts" },
  { message = "^chore\\(marketplace\\)", skip = true },
  { message = "^chore\\(manifest", skip = true },
  { message = "^chore", group = "Chores" },
]

commit_preprocessors = [
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/JirakJ/agentic-os-agi/issues/${1}))" },
]
